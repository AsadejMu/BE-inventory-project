# Postgres สำหรับพัฒนาในเครื่อง โหลด schema + seed อัตโนมัติครั้งแรกที่สร้าง volume
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: techstock
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
volumes:
  dbdata:
